# Example for MSI MAG B850M Mortar WiFi + Freebox Ultra Essentiel
# Use: export LUKS_PASSPHRASE='your-passphrase'
#      python3 install.py --config config.yaml --pre-install

disks:
  - /dev/disk/by-id/nvme-REPLACE_DISK1
  - /dev/disk/by-id/nvme-REPLACE_DISK2

hostname: pve
domain: home.arpa
debian_suite: trixie
root_mount: /mnt

network:
  # DHCP works out of the box on the Freebox LAN.
  mode: dhcp
  # interface: enp5s0

  # For a fixed Proxmox management IP, use static instead:
  # mode: static
  # interface: enp5s0
  # address: 192.168.1.50
  # gateway: 192.168.1.254
  # netmask: 255.255.255.0

dropbear:
  authorized_keys: /root/.ssh/authorized_keys
  convert_openssh_keys: true

luks:
  passphrase_env: LUKS_PASSPHRASE
